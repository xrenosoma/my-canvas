<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Canvas</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>

<script type="module">
  import {
    JSONCanvasViewer,
    parser,
    fetchCanvas
  } from "https://unpkg.com/json-canvas-viewer";

  const canvas = await fetchCanvas("./canvas.canvas");

  new JSONCanvasViewer({
    container: document.body,
    canvas: canvas,
    parser: parser
  });
</script>

</body>
</html>
