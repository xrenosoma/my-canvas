<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f5f5f5;
    }
  </style>
</head>

<body>

<script type="module">
  import {
    JSONCanvasViewer,
    parser,
    loadCanvas
  } from "https://unpkg.com/json-canvas-viewer/dist/chimp.js";

  new JSONCanvasViewer({
    container: document.body,
    canvas: loadCanvas("./canvas.canvas"),
    markdownParser: parser,
  });
</script>

</body>
</html>
